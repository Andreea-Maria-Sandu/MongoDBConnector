- stage: ValidateDependencies
  jobs:
    - job: validateJ
      steps:
        - task: Gradle@3
          inputs:
            workingDirectory: ''
            gradleWrapperFile: 'gradlew'
            gradleOptions: '-Xmx3072m'
            javaHomeOption: 'JDKVersion'
            jdkVersionOption: '1.21'
            jdkArchitectureOption: 'x64'
            publishJUnitResults: true
            testResultsFiles: '**/TEST-*.xml'
            tasks: 'release'
        - task: SonatypeEvaluate@2
          inputs:
            cliVersion: '2.8.5'
            nexusIqService: 'iq-server'
            applicationId: 'dts-blade-mongo-$(Build.SourceBranchName)'
            organizationId: '38f9ab6e9d4245599753658e47061405'
            stage: 'Build'
            ignoreSystemError: true
            ignoreScanningError: true
            # enableReachability: true
            # reachabilityNamespaces: com.alloy.datatransitsystem
            scanTargets: 'build/release/**/*.jar'
            enableDebugLogging: true

- stage: Publish
  dependsOn: ValidateDependencies #starts only after it
  jobs:
  - job: publishJ
    steps:
    - task: Gradle@3
      inputs:
        workingDirectory: ''
        gradleWrapperFile: 'gradlew'
        gradleOptions: '-Xmx3072m -Dorg.gradle.internal.http.socketTimeout=180000'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: false
        testResultsFiles: '**/TEST-*.xml'
        tasks: '--refresh-dependencies publish'

- stage: Release
  dependsOn: ValidateDependencies
  jobs:
    - job: releaseJob
      steps:
        - task: Gradle@3
          inputs:
            workingDirectory: ''
            gradleWrapperFile: 'gradlew'
            gradleOptions: '-Xmx3072m'
            javaHomeOption: 'JDKVersion'
            jdkVersionOption: '1.21'
            jdkArchitectureOption: 'x64'
            publishJUnitResults: false
            testResultsFiles: '**/TEST-*.xml'
            tasks: 'release'
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Pipeline.Workspace)/s/build/release'
            publishLocation: 'pipeline'